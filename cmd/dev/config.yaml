# GoQQBot 配置文件

server:
  host: "0.0.0.0"        # 监听地址，0.0.0.0 表示所有网卡
  port: 8080             # HTTP 端口（QQ 回调用）

  pool:                  # Worker Pool 配置
    workers: 10          # 并发工作协程数（建议：CPU 核心数 * 2）
    queueSize: 100       # 任务队列长度（建议：workers * 10）

bot:
  appId: 123456789       # QQ 机器人 AppID（从 QQ 开放平台获取）
  token: "your-token-here"           # 验证 Token
  appSecret: "your-secret-here"      # App Secret（用于签名验证）